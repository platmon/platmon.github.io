name: apt

# Adds published platmon releases to the APT repository at
# https://platmon.github.io/apt and re-signs its index. Run by hand; the apt
# environment holds the signing key and waits for the owner's approval.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "platmon release tags to add, separated by spaces (e.g. v1.4.0); empty only re-signs"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: apt
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: apt
      url: https://platmon.github.io/apt/
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - name: Install APT index tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils
      - name: Import the signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          echo "GNUPGHOME=$RUNNER_TEMP/gnupg" >> "$GITHUB_ENV"
          install -d -m 0700 "$RUNNER_TEMP/gnupg"
          printf '%s\n' "$APT_SIGNING_KEY" | GNUPGHOME="$RUNNER_TEMP/gnupg" gpg --batch --import
      - name: Add releases and sign the index
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ inputs.tags }}
        run: |
          # Word splitting is intended: TAGS is a list of tags, and update.sh rejects anything else.
          # shellcheck disable=SC2086
          apt/tools/update.sh $TAGS
      - name: Commit and push
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apt
          git commit -m "Update the APT repository${TAGS:+ with platmon $TAGS}"
          git push origin HEAD:main
      - name: Wait until Pages serves the new index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null || true
          for i in $(seq 60); do
            if curl -fsS "https://platmon.github.io/apt/dists/stable/InRelease?run=$GITHUB_RUN_ID-$i" -o served && cmp -s served apt/dists/stable/InRelease; then
              echo "served after about $((i * 15)) s"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Pages does not serve the new InRelease after 15 minutes"
          exit 1
